<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfraQ Showcase Website</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #0b0f19;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 48px;
      max-width: 600px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 32px;
      margin: 0 0 16px;
      letter-spacing: -0.02em;
    }
    p {
      color: #9ca3af;
      font-size: 16px;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 8px;
      color: #34d399;
      font-weight: 500;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">LIVE ON AWS S3 & CLOUDFRONT</div>
    <h1>Deployed Successfully by InfraQ</h1>
    <p>Autonomous Multi-Agent Infrastructure Engineering on Amazon Web Services. Zero-touch IaC generation, automated verification, and instant deployment.</p>
    <div class="status">✓ Infrastructure Status: Healthy & Synced · Region: us-east-2</div>
  </div>
</body>
</html>
